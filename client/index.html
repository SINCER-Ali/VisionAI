<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VisionAI - Client</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f0f0f;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            width: 100%;
            padding: 1.5rem 2rem;
            background: #1a1a2e;
            border-bottom: 1px solid #2a2a3e;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        header h1 {
            font-size: 1.4rem;
            font-weight: 600;
            color: #fff;
        }

        header span {
            font-size: 0.85rem;
            color: #888;
        }

        main {
            width: 100%;
            max-width: 800px;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .card {
            background: #1a1a2e;
            border: 1px solid #2a2a3e;
            border-radius: 12px;
            padding: 1.5rem;
        }

        .card h2 {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 1rem;
            color: #ccc;
        }

        .upload-zone {
            border: 2px dashed #3a3a5e;
            border-radius: 8px;
            padding: 2rem;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.2s, background 0.2s;
        }

        .upload-zone:hover {
            border-color: #6c63ff;
            background: rgba(108, 99, 255, 0.05);
        }

        .upload-zone.dragover {
            border-color: #6c63ff;
            background: rgba(108, 99, 255, 0.1);
        }

        .upload-zone p {
            color: #888;
            font-size: 0.9rem;
        }

        .upload-zone .icon {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        #file-input { display: none; }

        #preview-container {
            display: none;
            margin-top: 1rem;
            text-align: center;
        }

        #preview-container img {
            max-width: 100%;
            max-height: 300px;
            border-radius: 8px;
            border: 1px solid #2a2a3e;
        }

        #preview-container .filename {
            margin-top: 0.5rem;
            font-size: 0.8rem;
            color: #888;
        }

        .model-select {
            display: flex;
            gap: 0.5rem;
            align-items: center;
            margin-bottom: 1rem;
        }

        .model-select label {
            font-size: 0.85rem;
            color: #aaa;
        }

        .model-select select, .model-select button {
            background: #2a2a3e;
            color: #e0e0e0;
            border: 1px solid #3a3a5e;
            border-radius: 6px;
            padding: 0.4rem 0.8rem;
            font-size: 0.85rem;
        }

        .model-select button {
            cursor: pointer;
            transition: background 0.2s;
        }

        .model-select button:hover {
            background: #3a3a5e;
        }

        .btn-predict {
            width: 100%;
            padding: 0.8rem;
            background: #6c63ff;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-predict:hover {
            background: #5a52e0;
        }

        .btn-predict:disabled {
            background: #3a3a5e;
            cursor: not-allowed;
        }

        #result-container {
            display: none;
        }

        .result-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.8rem;
        }

        .result-class {
            font-size: 1.8rem;
            font-weight: 700;
            color: #6c63ff;
        }

        .result-confidence {
            font-size: 1rem;
            color: #aaa;
        }

        .confidence-bar {
            width: 100%;
            height: 8px;
            background: #2a2a3e;
            border-radius: 4px;
            overflow: hidden;
        }

        .confidence-bar .fill {
            height: 100%;
            background: #6c63ff;
            border-radius: 4px;
            transition: width 0.5s ease;
        }

        .error-msg {
            color: #ff6b6b;
            font-size: 0.85rem;
            text-align: center;
            padding: 0.5rem;
        }

        .server-config {
            display: flex;
            gap: 0.5rem;
            align-items: center;
            margin-bottom: 1rem;
        }

        .server-config label {
            font-size: 0.85rem;
            color: #aaa;
            white-space: nowrap;
        }

        .server-config input {
            flex: 1;
            background: #2a2a3e;
            color: #e0e0e0;
            border: 1px solid #3a3a5e;
            border-radius: 6px;
            padding: 0.4rem 0.8rem;
            font-size: 0.85rem;
        }

        .spinner {
            display: none;
            width: 24px;
            height: 24px;
            border: 3px solid #3a3a5e;
            border-top: 3px solid #6c63ff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0.5rem auto;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <header>
        <h1>VisionAI</h1>
        <span>Classification d'images par ML</span>
    </header>

    <main>
        <div class="card">
            <h2>Configuration</h2>
            <div class="server-config">
                <label for="server-url">Serveur API :</label>
                <input type="text" id="server-url" value="http://localhost:3000" />
            </div>
            <div class="model-select">
                <label for="model-name">Modele :</label>
                <select id="model-name">
                    <option value="default">default</option>
                </select>
                <button id="btn-refresh" type="button" title="Rafraichir la liste">Rafraichir</button>
            </div>
        </div>

        <div class="card">
            <h2>Upload d'image</h2>
            <div class="upload-zone" id="upload-zone">
                <div class="icon">+</div>
                <p>Glissez une image ici ou cliquez pour en choisir une</p>
            </div>
            <input type="file" id="file-input" accept="image/*" />
            <div id="preview-container">
                <img id="preview-img" alt="Apercu" />
                <div class="filename" id="filename"></div>
            </div>
        </div>

        <button class="btn-predict" id="btn-predict" disabled>Lancer la prediction</button>
        <div class="spinner" id="spinner"></div>

        <div class="card" id="result-container">
            <h2>Resultat</h2>
            <div class="result-box">
                <div class="result-class" id="result-class"></div>
                <div class="result-confidence" id="result-confidence"></div>
                <div class="confidence-bar">
                    <div class="fill" id="confidence-fill" style="width: 0%"></div>
                </div>
            </div>
        </div>

        <div class="error-msg" id="error-msg"></div>
    </main>

    <script>
        const uploadZone = document.getElementById('upload-zone');
        const fileInput = document.getElementById('file-input');
        const previewContainer = document.getElementById('preview-container');
        const previewImg = document.getElementById('preview-img');
        const filenameEl = document.getElementById('filename');
        const btnPredict = document.getElementById('btn-predict');
        const btnRefresh = document.getElementById('btn-refresh');
        const spinner = document.getElementById('spinner');
        const resultContainer = document.getElementById('result-container');
        const resultClass = document.getElementById('result-class');
        const resultConfidence = document.getElementById('result-confidence');
        const confidenceFill = document.getElementById('confidence-fill');
        const errorMsg = document.getElementById('error-msg');
        const serverUrl = document.getElementById('server-url');
        const modelSelect = document.getElementById('model-name');

        let currentBase64 = null;

        uploadZone.addEventListener('click', function() { fileInput.click(); });

        uploadZone.addEventListener('dragover', function(e) {
            e.preventDefault();
            uploadZone.classList.add('dragover');
        });

        uploadZone.addEventListener('dragleave', function() {
            uploadZone.classList.remove('dragover');
        });

        uploadZone.addEventListener('drop', function(e) {
            e.preventDefault();
            uploadZone.classList.remove('dragover');
            if (e.dataTransfer.files.length > 0) {
                handleFile(e.dataTransfer.files[0]);
            }
        });

        fileInput.addEventListener('change', function() {
            if (fileInput.files.length > 0) {
                handleFile(fileInput.files[0]);
            }
        });

        function handleFile(file) {
            if (!file.type.startsWith('image/')) {
                showError('Veuillez selectionner une image.');
                return;
            }

            var reader = new FileReader();
            reader.onload = function(e) {
                var dataUrl = e.target.result;
                previewImg.src = dataUrl;
                filenameEl.textContent = file.name;
                previewContainer.style.display = 'block';
                currentBase64 = dataUrl.split(',')[1];
                btnPredict.disabled = false;
                hideError();
                resultContainer.style.display = 'none';
            };
            reader.readAsDataURL(file);
        }

        btnPredict.addEventListener('click', async function() {
            if (!currentBase64) return;

            btnPredict.disabled = true;
            spinner.style.display = 'block';
            resultContainer.style.display = 'none';
            hideError();

            var base = serverUrl.value.replace(/\/+$/, '');
            var model = modelSelect.value;

            try {
                var resp = await fetch(base + '/predict', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        model_name: model,
                        image_base64: currentBase64,
                    }),
                });

                if (!resp.ok) {
                    var err = await resp.json().catch(function() { return { error: resp.statusText }; });
                    throw new Error(err.error || 'Erreur serveur');
                }

                var data = await resp.json();
                resultClass.textContent = data.predicted_class;
                var pct = (data.confidence * 100).toFixed(1);
                resultConfidence.textContent = 'Confiance : ' + pct + '%';
                confidenceFill.style.width = pct + '%';
                resultContainer.style.display = 'block';
            } catch (e) {
                showError(e.message);
            } finally {
                spinner.style.display = 'none';
                btnPredict.disabled = false;
            }
        });

        btnRefresh.addEventListener('click', async function() {
            var base = serverUrl.value.replace(/\/+$/, '');
            try {
                var resp = await fetch(base + '/models');
                if (!resp.ok) throw new Error('Impossible de charger les modeles');
                var data = await resp.json();

                // Vider le select de maniere safe
                while (modelSelect.firstChild) {
                    modelSelect.removeChild(modelSelect.firstChild);
                }

                if (data.models && data.models.length > 0) {
                    data.models.forEach(function(m) {
                        var name = m.name || 'unknown';
                        var opt = document.createElement('option');
                        opt.value = name;
                        opt.textContent = name;
                        modelSelect.appendChild(opt);
                    });
                } else {
                    var opt = document.createElement('option');
                    opt.value = 'default';
                    opt.textContent = 'default (aucun modele trouve)';
                    modelSelect.appendChild(opt);
                }
                hideError();
            } catch (e) {
                showError(e.message);
            }
        });

        function showError(msg) {
            errorMsg.textContent = msg;
            errorMsg.style.display = 'block';
        }

        function hideError() {
            errorMsg.textContent = '';
            errorMsg.style.display = 'none';
        }

        window.addEventListener('load', function() {
            btnRefresh.click();
        });
    </script>
</body>
</html>
